<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Chess Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body class="relative flex flex-col justify-between h-screen w-screen overflow-hidden">

    <!-- 3D Canvas -->
    <div id="canvas-container" class="absolute inset-0"></div>

    <!-- Top UI Overlay -->
    <div class="relative z-10 p-4 flex justify-between items-center text-white pointer-events-none">
        <div class="bg-slate-900/80 px-4 py-2 rounded-2xl border border-amber-500/40 shadow-lg pointer-events-auto">
            <h1 class="text-sm font-bold text-amber-400">3D Daba (Chess)</h1>
            <p class="text-[10px] text-slate-400">Drag to rotate board | Click piece to move</p>
        </div>
        <div class="bg-slate-900/80 px-4 py-2 rounded-2xl border border-sky-500/40 shadow-lg pointer-events-auto text-right">
            <span class="text-[10px] text-slate-400 block">Current Turn</span>
            <span id="turn-display" class="font-bold text-sm text-emerald-400">WHITE</span>
        </div>
    </div>

    <!-- Status Message -->
    <div id="status-msg" class="relative z-10 mx-auto bg-slate-900/90 text-amber-300 text-xs px-4 py-1.5 rounded-full border border-slate-700 shadow-md min-h-[28px] flex items-center justify-center">
        White's turn to play.
    </div>

    <!-- Bottom Controls -->
    <div class="relative z-10 p-4 flex justify-center space-x-3 pointer-events-auto">
        <button onclick="resetGame()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs shadow-lg transition flex items-center space-x-1">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Reset Game</span>
        </button>
        <button onclick="resetCamera()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-4 py-2 rounded-xl text-xs border border-slate-600 shadow-lg transition flex items-center space-x-1">
            <i class="fa-solid fa-camera"></i>
            <span>Reset Camera</span>
        </button>
    </div>

    <!-- 3D Engine Code -->
    <script>
        let scene, camera, renderer, controls;
        let boardGroup, piecesGroup, highlightGroup;
        let raycaster, mouse;

        let selectedPiece = null;
        let turn = 'white'; // 'white' or 'black'

        // Initial Chess Board State (8x8)
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
        ]; // Lowercase = Black, Uppercase = White

        let boardState = JSON.parse(JSON.stringify(initialBoard));

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 12, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            boardGroup = new THREE.Group();
            piecesGroup = new THREE.Group();
            highlightGroup = new THREE.Group();

            scene.add(boardGroup);
            scene.add(piecesGroup);
            scene.add(highlightGroup);

            createBoard();
            createPieces();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);

            animate();
        }

        // Create 8x8 Board
        function createBoard() {
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4 });
            const lightMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });
            const borderMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });

            // Board Frame
            const frameGeo = new THREE.BoxGeometry(9, 0.4, 9);
            const frame = new THREE.Mesh(frameGeo, borderMat);
            frame.position.y = -0.2;
            boardGroup.add(frame);

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const isDark = (row + col) % 2 === 1;
                    const tileGeo = new THREE.BoxGeometry(1, 0.2, 1);
                    const tile = new THREE.Mesh(tileGeo, isDark ? darkMat : lightMat);
                    
                    tile.position.set(col - 3.5, 0, row - 3.5);
                    tile.userData = { row: row, col: col, type: 'tile' };
                    tile.receiveShadow = true;
                    boardGroup.add(tile);
                }
            }
        }

        // Create 3D Chess Pieces
        function createPieces() {
            // Clear existing
            while(piecesGroup.children.length > 0) { 
                piecesGroup.remove(piecesGroup.children[0]); 
            }

            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.2, metalness: 0.1 });
            const blackMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2, metalness: 0.2 });

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const code = boardState[row][col];
                    if (!code) continue;

                    const isWhite = code === code.toUpperCase();
                    const mat = isWhite ? whiteMat : blackMat;
                    const pieceMesh = generatePieceMesh(code.toLowerCase(), mat);

                    pieceMesh.position.set(col - 3.5, 0.1, row - 3.5);
                    pieceMesh.userData = { row: row, col: col, type: 'piece', isWhite: isWhite, code: code };
                    piecesGroup.add(pieceMesh);
                }
            }
        }

        // Shape 3D Mesh according to piece type
        function generatePieceMesh(type, mat) {
            const group = new THREE.Group();

            // Base
            const baseGeo = new THREE.CylinderGeometry(0.35, 0.4, 0.15, 16);
            const base = new THREE.Mesh(baseGeo, mat);
            base.position.y = 0.075;
            base.castShadow = true;
            group.add(base);

            let bodyGeo;
            if (type === 'p') { // Pawn
                bodyGeo = new THREE.SphereGeometry(0.25, 16, 16);
                const body = new THREE.Mesh(bodyGeo, mat);
                body.position.y = 0.4;
                group.add(body);
            } else if (type === 'r') { // Rook / Nouka
                bodyGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.6, 12);
                const body = new THREE.Mesh(bodyGeo, mat);
                body.position.y = 0.45;
                group.add(body);
            } else if (type === 'n') { // Knight / Ghora
                bodyGeo = new THREE.BoxGeometry(0.3, 0.6, 0.4);
                const body = new THREE.Mesh(bodyGeo, mat);
                body.position.y = 0.45;
                group.add(body);
            } else if (type === 'b') { // Bishop / Hathi
                bodyGeo = new THREE.ConeGeometry(0.28, 0.7, 16);
                const body = new THREE.Mesh(bodyGeo, mat);
                body.position.y = 0.5;
                group.add(body);
            } else if (type === 'q') { // Queen / Mantri
                bodyGeo = new THREE.CylinderGeometry(0.2, 0.35, 0.9, 16);
                const body = new THREE.Mesh(bodyGeo, mat);
                body.position.y = 0.6;
                group.add(body);
            } else if (type === 'k') { // King / Raja
                bodyGeo = new THREE.CylinderGeometry(0.22, 0.38, 1.0, 16);
                const body = new THREE.Mesh(bodyGeo, mat);
                body.position.y = 0.65;
                group.add(body);
            }

            return group;
        }

        // Handle Click / Tap
        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([...piecesGroup.children, ...boardGroup.children], true);

            if (intersects.length > 0) {
                let hitObj = intersects[0].object;
                while (hitObj.parent && hitObj.parent !== piecesGroup && hitObj.parent !== boardGroup && hitObj.parent !== scene) {
                    hitObj = hitObj.parent;
                }

                const data = hitObj.userData;

                if (data.type === 'piece') {
                    // Check turn
                    if ((turn === 'white' && data.isWhite) || (turn === 'black' && !data.isWhite)) {
                        selectedPiece = data;
                        highlightSquare(data.row, data.col);
                        document.getElementById('status-msg').innerText = `Selected ${data.code} at (${data.row}, ${data.col}). Click destination tile.`;
                    } else if (selectedPiece) {
                        // Capture move
                        movePiece(selectedPiece.row, selectedPiece.col, data.row, data.col);
                    }
                } else if (data.type === 'tile' && selectedPiece) {
                    // Move to tile
                    movePiece(selectedPiece.row, selectedPiece.col, data.row, data.col);
                }
            }
        }

        function highlightSquare(row, col) {
            while(highlightGroup.children.length > 0) { highlightGroup.remove(highlightGroup.children[0]); }

            const hlGeo = new THREE.PlaneGeometry(0.95, 0.95);
            const hlMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
            const hlMesh = new THREE.Mesh(hlGeo, hlMat);
            hlMesh.rotation.x = -Math.PI / 2;
            hlMesh.position.set(col - 3.5, 0.11, row - 3.5);
            highlightGroup.add(hlMesh);
        }

        function movePiece(fromRow, fromCol, toRow, toCol) {
            if (fromRow === toRow && fromCol === toCol) return;

            // Execute Move
            const pieceCode = boardState[fromRow][fromCol];
            boardState[toRow][toCol] = pieceCode;
            boardState[fromRow][fromCol] = '';

            selectedPiece = null;
            while(highlightGroup.children.length > 0) { highlightGroup.remove(highlightGroup.children[0]); }

            // Switch Turn
            turn = (turn === 'white') ? 'black' : 'white';
            document.getElementById('turn-display').innerText = turn.toUpperCase();
            document.getElementById('turn-display').className = `font-bold text-sm ${turn === 'white' ? 'text-emerald-400' : 'text-rose-400'}`;
            document.getElementById('status-msg').innerText = `${turn.toUpperCase()}'s turn to move.`;

            createPieces();
        }

        function resetGame() {
            boardState = JSON.parse(JSON.stringify(initialBoard));
            turn = 'white';
            selectedPiece = null;
            document.getElementById('turn-display').innerText = 'WHITE';
            document.getElementById('turn-display').className = 'font-bold text-sm text-emerald-400';
            document.getElementById('status-msg').innerText = "Game reset. White's turn to play.";
            while(highlightGroup.children.length > 0) { highlightGroup.remove(highlightGroup.children[0]); }
            createPieces();
        }

        function resetCamera() {
            camera.position.set(0, 12, 12);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init3D;
    </script>
</body>
</html>
