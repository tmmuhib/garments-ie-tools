<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trims Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2pdf & html2canvas Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col p-3 max-w-2xl mx-auto">

    <!-- Main Container -->
    <main class="w-full space-y-3">

        <!-- Search Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 relative">
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Search PO Name or Style name:</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" placeholder="Type PO Name or Style name..." oninput="handleSearchInput()" class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <!-- Suggestion Dropdown -->
            <div id="suggestion-box" class="absolute left-4 right-4 bg-white border border-slate-200 rounded-xl shadow-xl mt-1 max-h-56 overflow-y-auto z-20 hidden no-scrollbar">
                <!-- Dynamic Suggestions -->
            </div>
        </div>

        <!-- Download Buttons -->
        <div id="download-actions" class="flex gap-2 justify-end hidden">
            <button onclick="downloadAsPDF()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs shadow transition flex items-center space-x-1.5">
                <i class="fa-solid fa-file-pdf text-sm"></i>
                <span>Download PDF</span>
            </button>
            <button onclick="downloadAsImage()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs shadow transition flex items-center space-x-1.5">
                <i class="fa-solid fa-file-image text-sm"></i>
                <span>Download Image</span>
            </button>
        </div>

        <!-- Printable Report Area -->
        <div id="report-area" class="space-y-3 hidden">
            
            <!-- PO Info & Production Summary Card -->
            <div class="bg-slate-900 text-white rounded-2xl p-4 shadow-sm border border-slate-800 space-y-3">
                <div class="pb-2 border-b border-slate-800">
                    <span class="text-[10px] uppercase tracking-wider text-slate-400 block">PO Name</span>
                    <h2 id="disp-po-name" class="text-xl font-bold text-amber-400">PO-XXXX</h2>
                </div>
                
                <!-- Details Info -->
                <div class="grid grid-cols-3 gap-2 text-xs border-b border-slate-800/80 pb-2.5">
                    <div>
                        <span class="text-slate-400 block text-[10px]">Buyer</span>
                        <span id="disp-buyer" class="font-semibold text-slate-200">N/A</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block text-[10px]">Style</span>
                        <span id="disp-style-name" class="font-semibold text-slate-200">N/A</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block text-[10px]">Shipment Date</span>
                        <span id="disp-shipment" class="font-semibold text-slate-200">N/A</span>
                    </div>
                </div>

                <!-- Production Summary Totals (Cutting, Input, Input Ready) -->
                <div class="grid grid-cols-3 gap-2 pt-0.5 text-center">
                    <div class="bg-slate-800/80 p-2 rounded-xl border border-slate-700/50">
                        <span class="text-slate-400 block text-[10px] mb-0.5">Total Cutting</span>
                        <span id="sum-cutting" class="font-bold text-sm text-emerald-400">0</span>
                    </div>
                    <div class="bg-slate-800/80 p-2 rounded-xl border border-slate-700/50">
                        <span class="text-slate-400 block text-[10px] mb-0.5">Total Input</span>
                        <span id="sum-input" class="font-bold text-sm text-sky-400">0</span>
                    </div>
                    <div class="bg-slate-800/80 p-2 rounded-xl border border-slate-700/50">
                        <span class="text-slate-400 block text-[10px] mb-0.5">Input Ready</span>
                        <span id="sum-input-ready" class="font-bold text-sm text-amber-400">0</span>
                    </div>
                </div>
            </div>

            <!-- Summary Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-3 border-b border-slate-100 bg-slate-50">
                    <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Trims Requirement Summary</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 border-b border-slate-200">
                                <th class="p-3 font-semibold">Trims Name</th>
                                <th class="p-3 font-semibold text-right">WO Qnty</th>
                                <th class="p-3 font-semibold text-right">In-House-Qnty</th>
                                <th class="p-3 font-semibold text-right">Bal.</th>
                            </tr>
                        </thead>
                        <tbody id="trims-table-body" class="divide-y divide-slate-100">
                            <!-- Dynamic Rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Initial Status Card -->
        <div id="status-card" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center text-slate-500">
            <i class="fa-solid fa-cloud-arrow-down text-3xl text-emerald-500 mb-2 block"></i>
            <p id="loading-text" class="text-sm font-medium">Syncing Google Drive Sheet data...</p>
        </div>

    </main>

    <!-- Script Section -->
    <script>
        const API_KEY = "AIzaSyDAI_8a9hSn7yRXX7xN_kES65LtQ0MMXck";
        const SPREADSHEET_ID = "12ws1pIEdlRM36dQz_UgeXpGmUzuZAJtXjtKXvSCeCH4";
        
        let masterData = [];

        window.onload = function() {
            fetchSheetData();
        };

        async function fetchSheetData() {
            const loadingText = document.getElementById('loading-text');
            loadingText.innerText = "Connecting to Google Drive Sheet...";
            
            const dataUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/A1:Z5000?key=${API_KEY}`;
            
            try {
                const response = await fetch(dataUrl);
                const json = await response.json();
                
                if(json.error) {
                    alert("API Error: " + json.error.message);
                    loadingText.innerText = "Error loading sheet. Check share permissions.";
                    return;
                }

                if(json.values && json.values.length > 1) {
                    parseSheetRows(json.values);
                    document.getElementById('status-card').classList.add('hidden');
                    document.getElementById('search-input').focus();
                } else {
                    loadingText.innerText = "Spreadsheet is empty or has no records.";
                }

            } catch (err) {
                console.error(err);
                loadingText.innerText = "Failed to fetch data. Check internet connection.";
            }
        }

        function parseSheetRows(rows) {
            const headers = rows[0].map(h => (h || '').toString().trim());

            // Header Column Index Detection
            let idxBuyer = headers.findIndex(h => h.toLowerCase() === 'buyer');
            let idxStyle = headers.findIndex(h => h.toLowerCase() === 'style name');
            let idxPo = headers.findIndex(h => h.toLowerCase() === 'po name');
            let idxShipment = headers.findIndex(h => h.toLowerCase().includes('shipment'));
            let idxTrims = headers.findIndex(h => h.toLowerCase() === 'trims name');
            let idxWo = headers.findIndex(h => h.toLowerCase() === 'wo qnty');
            let idxInhouse = headers.findIndex(h => h.toLowerCase().includes('in-house'));
            
            // Cutting, Input, Input Ready Column Matcher
            let idxCutting = headers.findIndex(h => h.toLowerCase().includes('total cutting') || h.toLowerCase().includes('cutting'));
            let idxInput = headers.findIndex(h => h.toLowerCase().includes('total input') || (h.toLowerCase().includes('input') && !h.toLowerCase().includes('ready')));
            let idxInputReady = headers.findIndex(h => h.toLowerCase().includes('input ready') || h.toLowerCase().includes('ready'));

            masterData = [];
            for(let i = 1; i < rows.length; i++) {
                let r = rows[i];
                if(!r || r.length === 0) continue;

                masterData.push({
                    buyer: idxBuyer !== -1 ? (r[idxBuyer] || '').toString().trim() : '',
                    styleName: idxStyle !== -1 ? (r[idxStyle] || '').toString().trim() : '',
                    poName: idxPo !== -1 ? (r[idxPo] || '').toString().trim() : '',
                    shipmentDate: idxShipment !== -1 ? (r[idxShipment] || '').toString().trim() : '',
                    trimsName: idxTrims !== -1 ? (r[idxTrims] || '').toString().trim() : '',
                    woQnty: idxWo !== -1 ? parseFloat((r[idxWo] || '0').toString().replace(/,/g, '')) || 0 : 0,
                    inhouseQnty: idxInhouse !== -1 ? parseFloat((r[idxInhouse] || '0').toString().replace(/,/g, '')) || 0 : 0,
                    cuttingQnty: idxCutting !== -1 ? parseFloat((r[idxCutting] || '0').toString().replace(/,/g, '')) || 0 : 0,
                    inputQnty: idxInput !== -1 ? parseFloat((r[idxInput] || '0').toString().replace(/,/g, '')) || 0 : 0,
                    inputReadyQnty: idxInputReady !== -1 ? parseFloat((r[idxInputReady] || '0').toString().replace(/,/g, '')) || 0 : 0
                });
            }
        }

        function handleSearchInput() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const box = document.getElementById('suggestion-box');

            if(query.length === 0) {
                box.classList.add('hidden');
                return;
            }

            let matchedPOs = [...new Set(masterData.filter(item => 
                item.poName.toLowerCase().includes(query) || 
                item.styleName.toLowerCase().includes(query)
            ).map(item => item.poName))].filter(p => p !== '');

            if(matchedPOs.length > 0) {
                box.innerHTML = '';
                matchedPOs.forEach(po => {
                    let sampleItem = masterData.find(i => i.poName === po);
                    let div = document.createElement('div');
                    div.className = "p-3 hover:bg-slate-50 cursor-pointer border-b border-slate-100 text-xs flex justify-between items-center";
                    div.innerHTML = `<div><span class="font-bold text-slate-800">${po}</span> <span class="text-slate-400 block text-[10px]">Style: ${sampleItem ? sampleItem.styleName : ''}</span></div> <i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i>`;
                    div.onclick = () => selectPO(po);
                    box.appendChild(div);
                });
                box.classList.remove('hidden');
            } else {
                box.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">No matching PO Name found</div>`;
                box.classList.remove('hidden');
            }
        }

        function selectPO(poName) {
            document.getElementById('search-input').value = poName;
            document.getElementById('suggestion-box').classList.add('hidden');

            const poRows = masterData.filter(i => i.poName.toLowerCase() === poName.toLowerCase());
            if(poRows.length === 0) return;

            document.getElementById('disp-po-name').innerText = poRows[0].poName;
            document.getElementById('disp-buyer').innerText = poRows[0].buyer || 'N/A';
            document.getElementById('disp-style-name').innerText = poRows[0].styleName || 'N/A';
            document.getElementById('disp-shipment').innerText = poRows[0].shipmentDate || 'N/A';

            // Calculate Sum for Cutting, Input, Input Ready for selected PO
            let totalCutting = 0;
            let totalInput = 0;
            let totalInputReady = 0;

            poRows.forEach(row => {
                totalCutting += row.cuttingQnty;
                totalInput += row.inputQnty;
                totalInputReady += row.inputReadyQnty;
            });

            document.getElementById('sum-cutting').innerText = totalCutting.toLocaleString();
            document.getElementById('sum-input').innerText = totalInput.toLocaleString();
            document.getElementById('sum-input-ready').innerText = totalInputReady.toLocaleString();
            
            document.getElementById('report-area').classList.remove('hidden');
            document.getElementById('download-actions').classList.remove('hidden');

            // Unique Trims Requirement Table
            let trimsMap = {};
            poRows.forEach(row => {
                let trim = row.trimsName || 'Unspecified Trim';
                if(!trimsMap[trim]) {
                    trimsMap[trim] = { wo: 0, inhouse: 0 };
                }
                trimsMap[trim].wo += row.woQnty;
                trimsMap[trim].inhouse += row.inhouseQnty;
            });

            const tbody = document.getElementById('trims-table-body');
            tbody.innerHTML = '';

            for(let trimName in trimsMap) {
                let data = trimsMap[trimName];
                let balance = data.wo - data.inhouse;

                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-slate-800">${trimName}</td>
                    <td class="p-3 text-right font-medium text-slate-700">${data.wo.toLocaleString()}</td>
                    <td class="p-3 text-right font-medium text-emerald-600">${data.inhouse.toLocaleString()}</td>
                    <td class="p-3 text-right font-bold ${balance < 0 ? 'text-rose-600' : 'text-sky-600'}">${balance.toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        // PDF Download
        function downloadAsPDF() {
            const element = document.getElementById('report-area');
            const poName = document.getElementById('disp-po-name').innerText;
            
            const opt = {
                margin:       0.3,
                filename:     `PO_Report_${poName}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }

        // Image PNG Download
        function downloadAsImage() {
            const element = document.getElementById('report-area');
            const poName = document.getElementById('disp-po-name').innerText;

            html2canvas(element, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `PO_Report_${poName}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
