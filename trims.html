<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IE Development - PO Trims Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-file-excel text-emerald-400 text-2xl"></i>
                <div>
                    <h1 class="text-base font-bold leading-tight">PO Trims Analysis</h1>
                    <p class="text-[11px] text-slate-400">Google Drive Sheets Live Data</p>
                </div>
            </div>
            <button onclick="fetchSheetData()" id="refresh-btn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-rotate text-emerald-400 mr-1"></i> Sync Data
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4">

        <!-- Search & Suggestion Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 relative">
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Search PO Name or Style Name:</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" placeholder="Type PO Name (e.g. PO-101) or Style..." oninput="handleSearchInput()" class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <!-- Suggestion Dropdown -->
            <div id="suggestion-box" class="absolute left-4 right-4 bg-white border border-slate-200 rounded-xl shadow-xl mt-1 max-h-56 overflow-y-auto z-20 hidden no-scrollbar">
                <!-- Dynamic Suggestions will render here -->
            </div>
        </div>

        <!-- Selected PO Details Card -->
        <div id="result-container" class="space-y-4 hidden">
            <div class="bg-gradient-to-r from-slate-900 to-slate-800 text-white rounded-2xl p-4 shadow-md flex justify-between items-center">
                <div>
                    <span class="text-[10px] uppercase tracking-wider text-slate-400 block">Selected PO Info</span>
                    <h2 id="disp-po-name" class="text-lg font-bold text-amber-400">PO-XXXX</h2>
                    <p class="text-xs text-slate-300">Style: <span id="disp-style-name" class="font-semibold text-white">Style-XXXX</span></p>
                </div>
                <div class="text-right">
                    <span class="text-[10px] text-slate-400 block">Status</span>
                    <span class="inline-block bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-2.5 py-1 rounded-full font-bold">Active Data</span>
                </div>
            </div>

            <!-- Trims Unique Summary Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                    <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Trims Requirement & Balance Summary</h3>
                    <span class="text-[11px] text-slate-500">Calculated Live</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 border-b border-slate-200">
                                <th class="p-3 font-semibold">Trims Name</th>
                                <th class="p-3 font-semibold text-right">WO Qnty</th>
                                <th class="p-3 font-semibold text-right">In-House Qnty</th>
                                <th class="p-3 font-semibold text-right">Balance (WO - Inhouse)</th>
                            </tr>
                        </thead>
                        <tbody id="trims-table-body" class="divide-y divide-slate-100">
                            <!-- Dynamic Rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Initial / Loading State -->
        <div id="status-card" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center text-slate-500">
            <i class="fa-solid fa-cloud-arrow-down text-3xl text-emerald-500 mb-2 block"></i>
            <p id="loading-text" class="text-sm font-medium">Click "Sync Data" or wait while fetching Google Drive Sheet...</p>
        </div>

    </main>

    <!-- Script Section -->
    <script>
        const API_KEY = "AIzaSyDAI_8a9hSn7yRXX7xN_kES65LtQ0MMXck";
        const SPREADSHEET_ID = "12ws1pIEdlRM36dQz_UgeXpGmUzuZAJtXjtKXvSCeCH4";
        let masterData = []; // To store parsed rows

        window.onload = function() {
            fetchSheetData();
        };

        // Fetch Google Sheet Data via Google Sheets API v4
        async function fetchSheetData() {
            const loadingText = document.getElementById('loading-text');
            loadingText.innerText = "Syncing data from Google Drive Sheet...";
            
            // First fetch spreadsheet metadata to get the first sheet name
            const metaUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}?key=${API_KEY}`;
            
            try {
                const metaRes = await fetch(metaUrl);
                const metaJson = await metaRes.json();
                
                if(metaJson.error) {
                    alert("API Error: " + metaJson.error.message);
                    loadingText.innerText = "Error loading sheet. Check permissions or API Key.";
                    return;
                }

                const sheetName = metaJson.sheets[0].properties.title;
                const dataUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${sheetName}!A1:Z1000?key=${API_KEY}`;

                const dataRes = await fetch(dataUrl);
                const dataJson = await dataRes.json();

                if(dataJson.values && dataJson.values.length > 1) {
                    parseSheetRows(dataJson.values);
                    document.getElementById('status-card').classList.add('hidden');
                    document.getElementById('search-input').focus();
                } else {
                    loadingText.innerText = "No records found in the spreadsheet.";
                }

            } catch (err) {
                console.error(err);
                loadingText.innerText = "Failed to connect to Google Drive. Check internet connection.";
            }
        }
