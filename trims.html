<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trims Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blue: {
                            350: '#3b82f6',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons (Updated CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2pdf & html2canvas Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- SheetJS Library for Excel Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col p-2 max-w-2xl mx-auto">

    <!-- Main Container -->
    <main class="w-full space-y-2">

        <!-- Search Section -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 relative">
            <div class="flex gap-2">
                <!-- Left: Job No or Buyer Search -->
                <div class="w-1/3">
                    <label class="block text-[10px] font-semibold text-slate-600 mb-1 truncate">Job / Buyer:</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-2 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-hashtag text-[10px]"></i>
                        </span>
                        <input type="text" id="search-job-input" placeholder="Job / Buyer..." oninput="handleJobSearchInput()" class="w-full pl-6 pr-1.5 py-1.5 text-xs bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>

                <!-- Right: PO Name or Style Search -->
                <div class="w-2/3">
                    <label class="block text-[10px] font-semibold text-slate-600 mb-1 truncate">PO Name or Style:</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-[10px]"></i>
                        </span>
                        <input type="text" id="search-po-input" placeholder="PO Name or Style..." oninput="handlePOSearchInput()" class="w-full pl-7 pr-2 py-1.5 text-xs bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Suggestion Dropdown -->
            <div id="suggestion-box" class="absolute left-3 right-3 bg-white border border-slate-200 rounded-lg shadow-xl mt-1 max-h-48 overflow-y-auto z-20 hidden no-scrollbar">
                <!-- Dynamic Suggestions -->
            </div>
        </div>

        <!-- Printable & Capturable Report Area -->
        <div id="report-area" class="space-y-2 hidden bg-white p-1 rounded-xl">
            
            <!-- PO Info & Production Summary Card -->
            <div class="bg-slate-900 text-white rounded-xl p-3.5 shadow-sm border border-slate-800 space-y-2.5 overflow-visible">
                <!-- Header with PO Name / Job & Action Icon Buttons -->
                <div class="flex justify-between items-center pb-2 border-b border-slate-800 pl-1">
                    <div class="pl-0.5">
                        <span class="text-[9px] uppercase tracking-wider text-slate-400 block mb-0.5 leading-normal" id="disp-title-label">PO Name / Job</span>
                        <h2 id="disp-po-name" class="text-base font-bold text-amber-400 leading-normal">PO-XXXX</h2>
                    </div>
                    <!-- Action Icon Buttons (Excel, PDF, Image, Print) - High Visibility Icons -->
                    <div id="action-buttons" class="flex items-center space-x-1.5">
                        <button type="button" onclick="handleExcelCopyAndDownload()" title="Download & Copy Excel File" class="bg-emerald-600 hover:bg-emerald-500 text-white p-1.5 rounded-lg shadow transition flex items-center justify-center w-8 h-8">
                            <i class="fa-solid fa-file-excel text-sm text-white" style="color: #ffffff;"></i>
                        </button>
                        <button type="button" onclick="handlePDFDownloadAndCopy()" title="Download & Copy PDF File" class="bg-rose-600 hover:bg-rose-500 text-white p-1.5 rounded-lg shadow transition flex items-center justify-center w-8 h-8">
                            <i class="fa-solid fa-file-pdf text-sm text-white" style="color: #ffffff;"></i>
                        </button>
                        <button type="button" onclick="copyAndDownloadImage()" title="Copy & Download Image" class="bg-sky-600 hover:bg-sky-500 text-white p-1.5 rounded-lg shadow transition flex items-center justify-center w-8 h-8">
                            <i class="fa-solid fa-image text-sm text-white" style="color: #ffffff;"></i>
                        </button>
                        <button type="button" onclick="window.print()" title="Print Report" class="bg-slate-700 hover:bg-slate-600 text-white p-1.5 rounded-lg shadow transition flex items-center justify-center w-8 h-8">
                            <i class="fa-solid fa-print text-sm text-white" style="color: #ffffff;"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Details Info -->
                <div class="grid grid-cols-3 gap-2 text-[11px] border-b border-slate-800/80 pb-2.5 pt-0.5 pl-1">
                    <div class="min-w-0">
                        <span class="text-slate-400 block text-[9px] mb-0.5">Buyer</span>
                        <span id="disp-buyer" class="font-semibold text-slate-200 leading-normal break-words block">N/A</span>
                    </div>
                    <div class="min-w-0">
                        <span class="text-slate-400 block text-[9px] mb-0.5">Style / Job</span>
                        <span id="disp-style-name" class="font-semibold text-slate-200 leading-normal break-words block">N/A</span>
                    </div>
                    <div class="min-w-0">
                        <span class="text-slate-400 block text-[9px] mb-0.5">Shipment Date</span>
                        <span id="disp-shipment" class="font-semibold text-slate-200 leading-normal break-words block">N/A</span>
                    </div>
                </div>

                <!-- Production Summary Totals -->
                <div class="grid grid-cols-4 gap-1.5 text-center pt-0.5">
                    <div class="bg-slate-800/80 p-1.5 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400 block text-[9px] leading-normal mb-0.5">Order Qty</span>
                        <span id="sum-order" class="font-bold text-xs text-indigo-400 leading-normal">0</span>
                    </div>
                    <div class="bg-slate-800/80 p-1.5 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400 block text-[9px] leading-normal mb-0.5">Total Cutting</span>
                        <span id="sum-cutting" class="font-bold text-xs text-emerald-400 leading-normal">0</span>
                    </div>
                    <div class="bg-slate-800/80 p-1.5 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400 block text-[9px] leading-normal mb-0.5">Total Input</span>
                        <span id="sum-input" class="font-bold text-xs text-sky-400 leading-normal">0</span>
                    </div>
                    <div class="bg-slate-800/80 p-1.5 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400 block text-[9px] leading-normal mb-0.5">Input Ready</span>
                        <span id="sum-input-ready" class="font-bold text-xs text-amber-400 leading-normal">0</span>
                    </div>
                </div>
            </div>

            <!-- Summary Table -->
            <div id="table-card" class="bg-white rounded-xl shadow-sm border border-slate-300 overflow-hidden">
                <div class="p-2 border-b border-slate-300 bg-slate-50 flex justify-between items-center">
                    <h3 class="text-[11px] font-bold text-slate-700 uppercase tracking-wider">Trims Requirement Summary</h3>
                </div>
                <div id="table-container" class="overflow-x-auto">
                    <table id="trims-table" class="w-full text-left border-collapse border border-slate-300 text-[11px]">
                        <thead>
                            <tr class="bg-blue-350 text-white border-b border-slate-300" style="background-color: #3b82f6; color: #ffffff;">
                                <th class="p-2 font-semibold border border-slate-300">Trims Name</th>
                                <th class="p-2 font-semibold text-right border border-slate-300">WO Qnty</th>
                                <th class="p-2 font-semibold text-right border border-slate-300">In-House-Qnty</th>
                                <th class="p-2 font-semibold text-right border border-slate-300">Bal.</th>
                            </tr>
                        </thead>
                        <tbody id="trims-table-body" class="divide-y divide-slate-300">
                            <!-- Dynamic Rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Initial Status Card -->
        <div id="status-card" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 text-center text-slate-500">
            <i class="fa-solid fa-cloud-arrow-down text-2xl text-emerald-500 mb-1.5 block"></i>
            <p id="loading-text" class="text-xs font-medium">Data is loading...</p>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-3.5 py-2 rounded-lg shadow-xl hidden z-50 transition flex items-center space-x-2 border border-slate-700">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">Copied to clipboard!</span>
    </div>

    <!-- Script Section -->
    <script>
        const API_KEY = "AIzaSyDAI_8a9hSn7yRXX7xN_kES65LtQ0MMXck";
        const SPREADSHEET_ID = "12ws1pIEdlRM36dQz_UgeXpGmUzuZAJtXjtKXvSCeCH4";
        
        let masterTrimsData = [];
        let prodSummaryDataByPO = {};
        let prodSummaryDataByJob = {};

        window.onload = function() {
            fetchSheetData();
        };

        const cleanNumber = (val) => {
            if (val === undefined || val === null || val === '') return 0;
            let numStr = val.toString().replace(/[^0-9.-]/g, '');
            let parsed = parseFloat(numStr);
            return isNaN(parsed) ? 0 : parsed;
        };

        function getColumnIndex(headers, keywords) {
            return headers.findIndex(h => {
                let text = (h || '').toString().trim().toLowerCase();
                return keywords.some(k => text.includes(k.toLowerCase()));
            });
        }

        async function fetchSheetData() {
            const loadingText = document.getElementById('loading-text');
            loadingText.innerText = "Data is loading...";
            
            const urlTrims = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/Trims!A1:AZ7500?key=${API_KEY}`;
            const urlData = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/data!A1:AZ5000?key=${API_KEY}`;
            
            try {
                const [resTrims, resData] = await Promise.all([fetch(urlTrims), fetch(urlData)]);
                const jsonTrims = await resTrims.json();
                const jsonData = await resData.json();

                if(jsonTrims.error || jsonData.error) {
                    let err = (jsonTrims.error || jsonData.error).message;
                    alert("API Error: " + err);
                    loadingText.innerText = "Error loading sheets.";
                    return;
                }

                if(jsonTrims.values && jsonTrims.values.length > 1) {
                    parseTrimsSheet(jsonTrims.values);
                }
                
                if(jsonData.values && jsonData.values.length > 1) {
                    parseDataSheet(jsonData.values);
                }

                document.getElementById('status-card').classList.add('hidden');
                document.getElementById('search-job-input').focus();

            } catch (err) {
                console.error(err);
                loadingText.innerText = "Failed to fetch data. Check internet connection.";
            }
        }

        function parseTrimsSheet(rows) {
            const headers = rows[0];

            let idxBuyer = getColumnIndex(headers, ['buyer']);
            let idxJob = getColumnIndex(headers, ['job no', 'job']);
            let idxStyle = getColumnIndex(headers, ['style name', 'style']);
            let idxPo = getColumnIndex(headers, ['po name', 'po']);
            let idxShipment = getColumnIndex(headers, ['shipment date', 'shipment', 'ship date']);
            let idxTrims = getColumnIndex(headers, ['trims name', 'trims', 'trim']);
            let idxWo = getColumnIndex(headers, ['wo qnty', 'wo qty', 'wo']);
            let idxInhouse = getColumnIndex(headers, ['in-house-qnty', 'in-house', 'inhouse']);

            masterTrimsData = [];
            for(let i = 1; i < rows.length; i++) {
                let r = rows[i];
                if(!r || r.length === 0) continue;

                masterTrimsData.push({
                    buyer: (idxBuyer !== -1 && r[idxBuyer] ? r[idxBuyer] : '').toString().trim(),
                    jobNo: (idxJob !== -1 && r[idxJob] ? r[idxJob] : '').toString().trim(),
                    styleName: (idxStyle !== -1 && r[idxStyle] ? r[idxStyle] : '').toString().trim(),
                    poName: (idxPo !== -1 && r[idxPo] ? r[idxPo] : '').toString().trim(),
                    shipmentDate: (idxShipment !== -1 && r[idxShipment] ? r[idxShipment] : '').toString().trim(),
                    trimsName: (idxTrims !== -1 && r[idxTrims] ? r[idxTrims] : '').toString().trim(),
                    woQnty: idxWo !== -1 ? cleanNumber(r[idxWo]) : 0,
                    inhouseQnty: idxInhouse !== -1 ? cleanNumber(r[idxInhouse]) : 0
                });
            }
        }

        function parseDataSheet(rows) {
            const headers = rows[0];

            let idxPo = getColumnIndex(headers, ['po name', 'po']);
            let idxJob = getColumnIndex(headers, ['job no', 'job']);
            let idxOrderQty = getColumnIndex(headers, ['order qty', 'order qnty', 'ord qty']);
            let idxCutting = getColumnIndex(headers, ['total cutting', 'cutting']);
            let idxInputReady = getColumnIndex(headers, ['input ready', 'ready']);
            
            let idxInput = headers.findIndex(h => {
                let text = (h || '').toString().trim().toLowerCase();
                return (text.includes('total input') || text.includes('input')) && !text.includes('ready');
            });

            prodSummaryDataByPO = {};
            prodSummaryDataByJob = {};

            for(let i = 1; i < rows.length; i++) {
                let r = rows[i];
                if(!r || r.length === 0) continue;

                let po = (idxPo !== -1 && r[idxPo] ? r[idxPo] : '').toString().trim().toLowerCase();
                let job = (idxJob !== -1 && r[idxJob] ? r[idxJob] : '').toString().trim().toLowerCase();

                let ord = idxOrderQty !== -1 ? cleanNumber(r[idxOrderQty]) : 0;
                let cut = idxCutting !== -1 ? cleanNumber(r[idxCutting]) : 0;
                let inp = idxInput !== -1 ? cleanNumber(r[idxInput]) : 0;
                let rdy = idxInputReady !== -1 ? cleanNumber(r[idxInputReady]) : 0;

                if(po) {
                    if(!prodSummaryDataByPO[po]) {
                        prodSummaryDataByPO[po] = { order: 0, cutting: 0, input: 0, inputReady: 0 };
                    }
                    prodSummaryDataByPO[po].order += ord;
                    prodSummaryDataByPO[po].cutting += cut;
                    prodSummaryDataByPO[po].input += inp;
                    prodSummaryDataByPO[po].inputReady += rdy;
                }

                if(job) {
                    if(!prodSummaryDataByJob[job]) {
                        prodSummaryDataByJob[job] = { order: 0, cutting: 0, input: 0, inputReady: 0 };
                    }
                    prodSummaryDataByJob[job].order += ord;
                    prodSummaryDataByJob[job].cutting += cut;
                    prodSummaryDataByJob[job].input += inp;
                    prodSummaryDataByJob[job].inputReady += rdy;
                }
            }
        }

        function handleJobSearchInput() {
            document.getElementById('search-po-input').value = '';
            const query = document.getElementById('search-job-input').value.toLowerCase().trim();
            const box = document.getElementById('suggestion-box');

            if(query.length === 0) {
                box.classList.add('hidden');
                return;
            }

            let matchedItems = masterTrimsData.filter(item => 
                item.jobNo.toLowerCase().includes(query) || 
                item.buyer.toLowerCase().includes(query)
            );

            let matchedKeys = [...new Set(matchedItems.map(item => item.jobNo || item.buyer))].filter(k => k !== '');

            if(matchedKeys.length > 0) {
                box.innerHTML = '';
                matchedKeys.forEach(key => {
                    let sampleItem = masterTrimsData.find(i => i.jobNo === key || i.buyer === key);
                    let isJob = sampleItem && sampleItem.jobNo === key;
                    let div = document.createElement('div');
                    div.className = "p-2 hover:bg-slate-50 cursor-pointer border-b border-slate-100 text-xs flex justify-between items-center";
                    div.innerHTML = `<div><span class="font-bold text-slate-800">${isJob ? 'Job: ' + key : 'Buyer: ' + key}</span> <span class="text-slate-400 block text-[9px]">Buyer: ${sampleItem ? sampleItem.buyer : ''} | Style: ${sampleItem ? sampleItem.styleName : ''}</span></div> <i class="fa-solid fa-chevron-right text-slate-300 text-[9px]"></i>`;
                    div.onclick = () => selectSearchResult(key, isJob ? 'job' : 'buyer');
                    box.appendChild(div);
                });
                box.classList.remove('hidden');
            } else {
                box.innerHTML = `<div class="p-2 text-xs text-slate-400 text-center">No matching Job / Buyer found</div>`;
                box.classList.remove('hidden');
            }
        }

        function handlePOSearchInput() {
            document.getElementById('search-job-input').value = '';
            const query = document.getElementById('search-po-input').value.toLowerCase().trim();
            const box = document.getElementById('suggestion-box');

            if(query.length === 0) {
                box.classList.add('hidden');
                return;
            }

            let matchedPOs = [...new Set(masterTrimsData.filter(item => 
                item.poName.toLowerCase().includes(query) || 
                item.styleName.toLowerCase().includes(query)
            ).map(item => item.poName))].filter(p => p !== '');

            if(matchedPOs.length > 0) {
                box.innerHTML = '';
                matchedPOs.forEach(po => {
                    let sampleItem = masterTrimsData.find(i => i.poName === po);
                    let div = document.createElement('div');
                    div.className = "p-2 hover:bg-slate-50 cursor-pointer border-b border-slate-100 text-xs flex justify-between items-center";
                    div.innerHTML = `<div><span class="font-bold text-slate-800">${po}</span> <span class="text-slate-400 block text-[9px]">Style: ${sampleItem ? sampleItem.styleName : ''}</span></div> <i class="fa-solid fa-chevron-right text-slate-300 text-[9px]"></i>`;
                    div.onclick = () => selectSearchResult(po, 'po');
                    box.appendChild(div);
                });
                box.classList.remove('hidden');
            } else {
                box.innerHTML = `<div class="p-2 text-xs text-slate-400 text-center">No matching PO Name found</div>`;
                box.classList.remove('hidden');
            }
        }

        function selectSearchResult(value, type) {
            document.getElementById('suggestion-box').classList.add('hidden');

            let filteredRows = [];
            let summary = { order: 0, cutting: 0, input: 0, inputReady: 0 };

            if(type === 'po') {
                document.getElementById('search-po-input').value = value;
                filteredRows = masterTrimsData.filter(i => i.poName.toLowerCase() === value.toLowerCase());
                summary = prodSummaryDataByPO[value.toLowerCase()] || summary;
                document.getElementById('disp-title-label').innerText = "PO Name";
                document.getElementById('disp-po-name').innerText = filteredRows[0]?.poName || value;
            } else if(type === 'job') {
                document.getElementById('search-job-input').value = value;
                filteredRows = masterTrimsData.filter(i => i.jobNo.toLowerCase() === value.toLowerCase());
                summary = prodSummaryDataByJob[value.toLowerCase()] || summary;
                document.getElementById('disp-title-label').innerText = "Job Number";
                document.getElementById('disp-po-name').innerText = `Job: ${filteredRows[0]?.jobNo || value}`;
            } else if(type === 'buyer') {
                document.getElementById('search-job-input').value = value;
                filteredRows = masterTrimsData.filter(i => i.buyer.toLowerCase() === value.toLowerCase());
                document.getElementById('disp-title-label').innerText = "Buyer Name";
                document.getElementById('disp-po-name').innerText = filteredRows[0]?.buyer || value;
                
                filteredRows.forEach(r => {
                    let poSum = prodSummaryDataByPO[r.poName.toLowerCase()];
                    if(poSum) {
                        summary.order += poSum.order;
                        summary.cutting += poSum.cutting;
                        summary.input += poSum.input;
                        summary.inputReady += poSum.inputReady;
                    }
                });
            }

            if(filteredRows.length === 0) return;

            document.getElementById('disp-buyer').innerText = filteredRows[0].buyer || 'N/A';
            document.getElementById('disp-style-name').innerText = filteredRows[0].styleName ? `${filteredRows[0].styleName} (${filteredRows[0].jobNo})` : 'N/A';
            document.getElementById('disp-shipment').innerText = filteredRows[0].shipmentDate || 'N/A';

            document.getElementById('sum-order').innerText = summary.order.toLocaleString();
            document.getElementById('sum-cutting').innerText = summary.cutting.toLocaleString();
            document.getElementById('sum-input').innerText = summary.input.toLocaleString();
            document.getElementById('sum-input-ready').innerText = summary.inputReady.toLocaleString();
            
            document.getElementById('report-area').classList.remove('hidden');

            let trimsMap = {};
            filteredRows.forEach(row => {
                let trim = row.trimsName || 'Unspecified Trim';
                if(!trimsMap[trim]) {
                    trimsMap[trim] = { wo: 0, inhouse: 0 };
                }
                trimsMap[trim].wo += row.woQnty;
                trimsMap[trim].inhouse += row.inhouseQnty;
            });

            const tbody = document.getElementById('trims-table-body');
            tbody.innerHTML = '';

            for(let trimName in trimsMap) {
                let data = trimsMap[trimName];
                let balance = data.inhouse - data.wo;

                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition border-b border-slate-300";
                tr.innerHTML = `
                    <td class="p-2 font-semibold text-slate-800 border border-slate-300">${trimName}</td>
                    <td class="p-2 text-right font-medium text-slate-700 border border-slate-300">${data.wo.toLocaleString()}</td>
                    <td class="p-2 text-right font-medium text-emerald-600 border border-slate-300">${data.inhouse.toLocaleString()}</td>
                    <td class="p-2 text-right font-bold border border-slate-300 ${balance < 0 ? 'text-rose-600' : 'text-sky-600'}">${balance.toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        // Action 1: Excel File Download + Excel Sheet Copy
        async function handleExcelCopyAndDownload() {
            const rawPoName = document.getElementById('disp-po-name').innerText;
            const poNameClean = rawPoName.replace(/[^a-zA-Z0-9_-]/g, '_').substring(0, 30) || "Trims_Report";
            
            const buyer = document.getElementById('disp-buyer').innerText;
            const style = document.getElementById('disp-style-name').innerText;
            const shipment = document.getElementById('disp-shipment').innerText;
            
            const order = document.getElementById('sum-order').innerText;
            const cutting = document.getElementById('sum-cutting').innerText;
            const input = document.getElementById('sum-input').innerText;
            const inputReady = document.getElementById('sum-input-ready').innerText;

            const excelData = [
                ["TRIMS TRACKER REPORT"],
                ["PO / Job:", rawPoName, "Buyer:", buyer],
                ["Style:", style, "Shipment Date:", shipment],
                ["Production Summary:", `Order Qty: ${order}`, `Cutting: ${cutting}`, `Input: ${input}`, `Input Ready: ${inputReady}`],
                [],
                ["Trims Name", "WO Qnty", "In-House-Qnty", "Bal."]
            ];

            const rows = document.querySelectorAll("#trims-table-body tr");
            rows.forEach(r => {
                const cols = r.querySelectorAll("td");
                if(cols.length >= 4) {
                    excelData.push([
                        cols[0].innerText,
                        cleanNumber(cols[1].innerText),
                        cleanNumber(cols[2].innerText),
                        cleanNumber(cols[3].innerText)
                    ]);
                }
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(excelData);
            XLSX.utils.book_append_sheet(wb, ws, poNameClean);

            XLSX.writeFile(wb, `${poNameClean}.xlsx`);

            try {
                const excelArrayBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const excelBlob = new Blob([excelArrayBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                
                const item = new ClipboardItem({
                    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': excelBlob
                });
                await navigator.clipboard.write([item]);
                showToast(`Downloaded & Copied ${poNameClean}.xlsx file!`);
            } catch (err) {
                let tsvData = "";
                excelData.forEach(row => { tsvData += row.join("\t") + "\n"; });
                navigator.clipboard.writeText(tsvData);
                showToast(`Downloaded ${poNameClean}.xlsx & copied sheet!`);
            }
        }

        // Action 2: PDF File Download + Summary Copy
        function handlePDFDownloadAndCopy() {
            const element = document.getElementById('report-area');
            const actionBtns = document.getElementById('action-buttons');
            const rawPoName = document.getElementById('disp-po-name').innerText;
            const poNameClean = rawPoName.replace(/[^a-zA-Z0-9_-]/g, '_');

            // Hide action buttons during PDF creation
            actionBtns.classList.add('hidden');

            const opt = {
                margin:       0.2,
                filename:     `Report_${poNameClean}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollX: 0, scrollY: 0 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                actionBtns.classList.remove('hidden');
            }).catch(() => {
                actionBtns.classList.remove('hidden');
            });

            // Copy Data Summary to Clipboard
            const buyer = document.getElementById('disp-buyer').innerText;
            const style = document.getElementById('disp-style-name').innerText;
            const shipment = document.getElementById('disp-shipment').innerText;
            const order = document.getElementById('sum-order').innerText;
            const cutting = document.getElementById('sum-cutting').innerText;
            const input = document.getElementById('sum-input').innerText;
            const inputReady = document.getElementById('sum-input-ready').innerText;

            let plainText = `📌 *TRIMS TRACKER REPORT*\n`;
            plainText += `*PO/Job:* ${rawPoName}\n`;
            plainText += `*Buyer:* ${buyer} | *Style:* ${style}\n`;
            plainText += `*Shipment Date:* ${shipment}\n\n`;
            plainText += `📊 *PRODUCTION SUMMARY*\n`;
            plainText += `Order Qty: ${order} | Cutting: ${cutting}\n`;
            plainText += `Input: ${input} | Input Ready: ${inputReady}\n\n`;
            plainText += `📦 *TRIMS REQUIREMENT SUMMARY*\n`;
            plainText += `-------------------------------------------\n`;
            plainText += `Trims Name\tWO Qnty\tIn-House\tBal.\n`;
            plainText += `-------------------------------------------\n`;

            const rows = document.querySelectorAll("#trims-table-body tr");
            rows.forEach(r => {
                const cols = r.querySelectorAll("td");
                if(cols.length >= 4) {
                    plainText += `${cols[0].innerText}\t${cols[1].innerText}\t${cols[2].innerText}\t${cols[3].innerText}\n`;
                }
            });

            navigator.clipboard.writeText(plainText).then(() => {
                showToast("PDF Downloaded & Summary Copied!");
            }).catch(() => {
                showToast("PDF Downloaded!");
            });
        }

        // Action 3: Copy & Download Image (Fixes Left Edge Clipping & Text Cutoffs)
        function copyAndDownloadImage() {
            const element = document.getElementById('report-area');
            const actionBtns = document.getElementById('action-buttons');
            const tableContainer = document.getElementById('table-container');
            const poNameClean = document.getElementById('disp-po-name').innerText.replace(/[^a-zA-Z0-9_-]/g, '_');

            // 1. Hide buttons before capturing
            actionBtns.classList.add('hidden');

            // 2. Clear scroll restrictions so text & long tables capture without clipping
            const originalOverflow = tableContainer.style.overflow;
            tableContainer.style.overflow = 'visible';

            html2canvas(element, {
                scale: 2,
                useCORS: true,
                scrollX: 0,
                scrollY: 0,
                windowWidth: element.scrollWidth + 10,
                windowHeight: element.scrollHeight + 10
            }).then(canvas => {
                // Restore buttons & overflow
                actionBtns.classList.remove('hidden');
                tableContainer.style.overflow = originalOverflow;

                canvas.toBlob(async (blob) => {
                    try {
                        const item = new ClipboardItem({ "image/png": blob });
                        await navigator.clipboard.write([item]);
                        showToast("Full Image Copied & Downloaded!");
                    } catch (err) {
                        showToast("Full Image Downloaded!");
                    }

                    const downloadLink = document.createElement('a');
                    downloadLink.download = `Report_${poNameClean}.png`;
                    downloadLink.href = canvas.toDataURL('image/png');
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                }, 'image/png');
            }).catch(err => {
                actionBtns.classList.remove('hidden');
                tableContainer.style.overflow = originalOverflow;
                console.error("Image error:", err);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
