<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TMChat - Mobile App</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wa: {
                            dark: '#0b141a',
                            panel: '#111b21',
                            card: '#202c33',
                            hover: '#2a3942',
                            green: '#00a884',
                            lightgreen: '#005c4b',
                            incoming: '#202c33',
                            text: '#e9edef',
                            subtext: '#8696a0',
                            border: '#222d34'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            position: fixed;
            background-color: #0b141a;
            color: #e9edef;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #374248; border-radius: 3px; }
    </style>
</head>
<body class="w-full h-full flex flex-col justify-between overflow-hidden">

    <!-- MAIN APP WRAPPER -->
    <div id="app-container" class="w-full h-full flex flex-col relative overflow-hidden max-w-md mx-auto bg-wa-dark">
        
        <!-- AUTH SCREEN -->
        <div id="auth-screen" class="absolute inset-0 z-50 bg-wa-dark flex items-center justify-center p-4">
            <div class="bg-wa-panel p-6 rounded-2xl shadow-2xl w-full border border-wa-border">
                <div class="text-center mb-5">
                    <div class="inline-flex items-center justify-center w-14 h-14 bg-wa-green text-white rounded-full text-2xl font-bold mb-2 shadow-lg">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <h1 class="text-xl font-bold text-wa-text">TMChat</h1>
                    <p id="auth-subtitle" class="text-wa-subtext text-xs mt-1">Sign in to start messaging & calling</p>
                </div>

                <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3">
                    <div id="name-field" class="hidden">
                        <label class="block text-[10px] uppercase text-wa-subtext font-semibold mb-1">Full Name</label>
                        <input type="text" id="auth-name" placeholder="Name" class="w-full bg-wa-dark text-wa-text px-3 py-2.5 rounded-xl border border-wa-border focus:outline-none focus:border-wa-green text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-wa-subtext font-semibold mb-1">Email</label>
                        <input type="email" id="auth-email" required placeholder="user@example.com" class="w-full bg-wa-dark text-wa-text px-3 py-2.5 rounded-xl border border-wa-border focus:outline-none focus:border-wa-green text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-wa-subtext font-semibold mb-1">Password</label>
                        <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-wa-dark text-wa-text px-3 py-2.5 rounded-xl border border-wa-border focus:outline-none focus:border-wa-green text-sm">
                    </div>
                    <button type="submit" id="auth-btn" class="w-full bg-wa-green hover:bg-emerald-600 text-white font-semibold py-2.5 rounded-xl transition text-sm shadow">Sign In</button>
                </form>

                <div class="text-center mt-4">
                    <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-wa-green text-xs hover:underline font-medium">Don't have an account? Register</button>
                </div>
            </div>
        </div>

        <!-- MAIN APP HEADER & TOPBAR -->
        <header id="main-header" class="hidden flex-col bg-wa-panel border-b border-wa-border shrink-0 z-30">
            <div class="h-12 px-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div id="current-user-avatar" class="w-8 h-8 rounded-full bg-wa-green text-white font-bold flex items-center justify-center text-xs shadow">U</div>
                    <span id="current-user-name" class="font-bold text-wa-text text-sm truncate max-w-[140px]">TMChat</span>
                </div>
                <button onclick="logout()" title="Logout" class="text-wa-subtext hover:text-red-400 text-sm p-1"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>

            <!-- TOPBAR TABS -->
            <nav class="flex items-center justify-around bg-wa-panel text-wa-subtext text-xs border-t border-wa-border/50 py-2">
                <button onclick="switchTab('friends')" id="tab-friends" class="flex flex-col items-center gap-1 text-wa-green font-semibold w-1/5">
                    <i class="fa-solid fa-user-group text-base"></i>
                    <span class="text-[10px]">Friends</span>
                </button>
                <button onclick="switchTab('chats')" id="tab-chats" class="flex flex-col items-center gap-1 hover:text-wa-text w-1/5">
                    <i class="fa-solid fa-comments text-base"></i>
                    <span class="text-[10px]">Chats</span>
                </button>
                <button onclick="switchTab('find')" id="tab-find" class="flex flex-col items-center gap-1 hover:text-wa-text w-1/5">
                    <i class="fa-solid fa-user-plus text-base"></i>
                    <span class="text-[10px]">Find</span>
                </button>
                <button onclick="switchTab('community')" id="tab-community" class="flex flex-col items-center gap-1 hover:text-wa-text w-1/5">
                    <i class="fa-solid fa-users text-base"></i>
                    <span class="text-[10px]">Community</span>
                </button>
                <button onclick="switchTab('settings')" id="tab-settings" class="flex flex-col items-center gap-1 hover:text-wa-text w-1/5">
                    <i class="fa-solid fa-gear text-base"></i>
                    <span class="text-[10px]">Settings</span>
                </button>
            </nav>
        </header>

        <!-- MAIN VIEW PANELS -->
        <main id="main-views" class="hidden flex-1 relative w-full overflow-hidden">
            
            <!-- FRIENDS TAB -->
            <section id="view-friends" class="absolute inset-0 flex flex-col p-3 overflow-y-auto">
                <h2 class="text-xs uppercase font-bold text-wa-subtext tracking-wider mb-2">My Friends</h2>
                <div id="friends-list" class="flex-1 space-y-2">
                    <!-- Friends List -->
                </div>
            </section>

            <!-- CHATS TAB -->
            <section id="view-chats" class="absolute inset-0 flex flex-col p-3 overflow-y-auto hidden">
                <h2 class="text-xs uppercase font-bold text-wa-subtext tracking-wider mb-2">Recent Chats</h2>
                <div id="recent-chats-list" class="flex-1 space-y-2">
                    <!-- Recent Chats -->
                </div>
            </section>

            <!-- FIND TAB -->
            <section id="view-find" class="absolute inset-0 flex flex-col p-3 overflow-y-auto hidden">
                <div class="mb-3">
                    <input type="text" id="db-user-search" oninput="searchUsersInDB(this.value)" placeholder="Type name or email..." class="w-full bg-wa-panel text-wa-text px-3 py-2.5 rounded-xl text-xs border border-wa-border focus:outline-none focus:border-wa-green">
                </div>
                <div id="db-search-results" class="flex-1 space-y-2">
                    <p class="text-center text-wa-subtext text-xs py-6">Search users in database to add as friend</p>
                </div>
            </section>

            <!-- COMMUNITY TAB -->
            <section id="view-community" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center hidden">
                <div class="w-16 h-16 rounded-full bg-wa-panel flex items-center justify-center text-wa-green text-2xl mb-3 border border-wa-border">
                    <i class="fa-solid fa-users"></i>
                </div>
                <h3 class="font-bold text-wa-text text-sm mb-1">TMChat Communities</h3>
                <p class="text-wa-subtext text-xs">Public groups and broadcasts will be available here soon.</p>
            </section>

            <!-- SETTINGS TAB -->
            <section id="view-settings" class="absolute inset-0 flex flex-col p-4 overflow-y-auto hidden">
                <div class="bg-wa-panel p-4 rounded-xl border border-wa-border space-y-4">
                    <div class="flex items-center gap-3 border-b border-wa-border/50 pb-3">
                        <div id="settings-avatar" class="w-12 h-12 rounded-full bg-wa-green text-white font-bold flex items-center justify-center text-lg">U</div>
                        <div>
                            <h3 id="settings-name" class="font-bold text-wa-text text-sm">User</h3>
                            <p id="settings-email" class="text-xs text-wa-subtext">email@domain.com</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="w-full bg-red-600/20 hover:bg-red-600/30 text-red-400 font-semibold py-2 rounded-lg text-xs transition">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i> Sign Out
                    </button>
                </div>
            </section>
        </main>

        <!-- FULLSCREEN MOBILE CHAT WINDOW -->
        <div id="active-chat-screen" class="fixed inset-0 z-50 bg-wa-dark flex flex-col w-full h-full max-w-md mx-auto hidden">
            
            <!-- Chat Header -->
            <div class="h-14 bg-wa-panel px-3 flex items-center justify-between border-b border-wa-border shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="closeChatScreen()" class="text-wa-subtext text-lg pr-1 hover:text-wa-text active:scale-95 transition"><i class="fa-solid fa-arrow-left"></i></button>
                    <div id="active-avatar" class="w-9 h-9 rounded-full bg-wa-green text-white font-bold flex items-center justify-center text-sm shadow">?</div>
                    <div>
                        <h3 id="active-name" class="font-bold text-wa-text text-sm leading-tight">Name</h3>
                        <p id="active-status" class="text-[10px] text-wa-subtext">offline</p>
                    </div>
                </div>
                <div class="flex items-center gap-4 text-wa-subtext text-base">
                    <button onclick="startCall('audio')" class="hover:text-wa-text p-1"><i class="fa-solid fa-phone"></i></button>
                    <button onclick="startCall('video')" class="hover:text-wa-text p-1"><i class="fa-solid fa-video"></i></button>
                </div>
            </div>

            <!-- Messages Box -->
            <div id="messages-box" class="flex-1 overflow-y-auto p-3 space-y-2 bg-[#0b141a] min-h-0">
                <!-- Chat Messages -->
            </div>

            <!-- Chat Input Bar -->
            <div class="bg-wa-panel p-2 flex items-center gap-2 border-t border-wa-border shrink-0 mb-1">
                <input type="file" id="attachment-input" class="hidden" onchange="handleAttachment(event)">
                <button onclick="document.getElementById('attachment-input').click()" class="text-wa-subtext text-lg p-2 hover:text-wa-text"><i class="fa-solid fa-paperclip"></i></button>
                <input type="text" id="message-input" onkeydown="if(event.key==='Enter') sendMessage()" placeholder="Type a message..." class="flex-1 bg-wa-dark text-wa-text px-3 py-2.5 rounded-xl text-xs border border-wa-border focus:outline-none focus:border-wa-green">
                <button onclick="sendMessage()" class="bg-wa-green text-white w-10 h-10 rounded-full flex items-center justify-center text-xs shadow active:scale-95 transition shrink-0"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- WEBRTC CALL SCREEN MODAL -->
        <div id="call-modal" class="hidden fixed inset-0 z-[100] bg-black/95 flex flex-col justify-between p-4 max-w-md mx-auto">
            <div class="flex justify-between items-center text-wa-text mt-2">
                <div>
                    <h3 id="call-user-name" class="font-bold text-base">User Name</h3>
                    <p id="call-status-badge" class="text-xs text-yellow-400">Ringing...</p>
                </div>
            </div>

            <div class="flex-1 relative flex items-center justify-center my-4 overflow-hidden rounded-2xl bg-wa-panel">
                <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <video id="local-video" autoplay playsinline muted class="absolute bottom-3 right-3 w-28 h-20 object-cover rounded-xl border-2 border-wa-green shadow-lg"></video>
                <div id="audio-call-indicator" class="hidden flex-col items-center justify-center text-wa-text">
                    <div class="w-20 h-20 rounded-full bg-wa-green flex items-center justify-center text-3xl mb-3 animate-pulse"><i class="fa-solid fa-microphone"></i></div>
                    <p class="text-sm font-medium">Voice Call in Progress...</p>
                </div>
            </div>

            <div class="flex justify-center items-center gap-6 mb-4">
                <button onclick="endCall()" class="w-14 h-14 rounded-full bg-red-600 active:bg-red-700 text-white flex items-center justify-center text-xl shadow-lg transition"><i class="fa-solid fa-phone-slash"></i></button>
            </div>
        </div>

    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvK59-OiliO6lC8NkRbO7uK5ESEEMg_e4",
            authDomain: "tma2z-4d472.firebaseapp.com",
            databaseURL: "https://tma2z-4d472-default-rtdb.firebaseio.com",
            projectId: "tma2z-4d472",
            storageBucket: "tma2z-4d472.firebasestorage.app",
            messagingSenderId: "637327747107",
            appId: "1:637327747107:web:39686aaa75a525cb22e996"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let isRegistering = false;
        let activeChatId = null;
        let targetFriendUid = null;
        let allUsersCache = {};
        let myFriendsCache = {};

        // WebRTC STUN Configuration
        let peerConnection = null;
        let localStream = null;
        let rtcCallRef = null;
        const iceServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-header').classList.remove('hidden');
                document.getElementById('main-header').classList.add('flex');
                document.getElementById('main-views').classList.remove('hidden');
                
                const userRef = db.ref('users/' + user.uid);
                userRef.once('value').then(snap => {
                    const defaultName = user.email ? user.email.split('@')[0] : 'User';
                    if (!snap.exists()) {
                        userRef.set({ uid: user.uid, name: defaultName, email: user.email || '', status: 'online' });
                    }
                    const val = snap.val() || {};
                    const name = val.name || defaultName;
                    
                    document.getElementById('current-user-name').innerText = name;
                    document.getElementById('current-user-avatar').innerText = name.charAt(0).toUpperCase();
                    document.getElementById('settings-name').innerText = name;
                    document.getElementById('settings-email').innerText = user.email || '';
                    document.getElementById('settings-avatar').innerText = name.charAt(0).toUpperCase();
                });

                initDashboard();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('main-header').classList.add('hidden');
                document.getElementById('main-views').classList.add('hidden');
            }
        });

        function toggleAuthMode() {
            isRegistering = !isRegistering;
            document.getElementById('name-field').classList.toggle('hidden', !isRegistering);
            document.getElementById('auth-btn').innerText = isRegistering ? "Register Account" : "Sign In";
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const name = document.getElementById('auth-name').value;

            if (isRegistering) {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(cred => db.ref('users/' + cred.user.uid).set({ uid: cred.user.uid, name: name || email.split('@')[0], email: email, status: 'online' }))
                    .catch(err => alert(err.message));
            } else {
                auth.signInWithEmailAndPassword(email, password).catch(err => alert(err.message));
            }
        }

        function logout() {
            if(currentUser) db.ref('users/' + currentUser.uid + '/status').set('offline');
            auth.signOut();
        }

        function initDashboard() {
            db.ref('users/' + currentUser.uid + '/status').set('online');
            db.ref('users/' + currentUser.uid + '/status').onDisconnect().set('offline');

            db.ref('users').on('value', snap => { if(snap.exists()) allUsersCache = snap.val(); });
            db.ref('friends/' + currentUser.uid).on('value', snap => {
                myFriendsCache = snap.val() || {};
                renderFriendsList();
                renderRecentChatsList();
            });
        }

        function switchTab(tabName) {
            ['friends', 'chats', 'find', 'community', 'settings'].forEach(t => {
                const view = document.getElementById(`view-${t}`);
                const tabBtn = document.getElementById(`tab-${t}`);
                if (t === tabName) {
                    view.classList.remove('hidden');
                    tabBtn.className = "flex flex-col items-center gap-1 text-wa-green font-semibold w-1/5";
                } else {
                    view.classList.add('hidden');
                    tabBtn.className = "flex flex-col items-center gap-1 hover:text-wa-text w-1/5";
                }
            });
        }

        function renderFriendsList() {
            const listEl = document.getElementById('friends-list');
            listEl.innerHTML = '';
            
            const friendUids = Object.keys(myFriendsCache);
            if (friendUids.length === 0) {
                listEl.innerHTML = `<p class="text-center text-wa-subtext text-xs py-8">No friends added yet.<br>Go to <b>Find</b> tab to search & add friends!</p>`;
                return;
            }

            friendUids.forEach(friendUid => {
                db.ref('users/' + friendUid).once('value').then(userSnap => {
                    const friendUser = userSnap.val() || {};
                    const friendName = friendUser.name || (friendUser.email ? friendUser.email.split('@')[0] : 'User');
                    const chatId = currentUser.uid < friendUid ? `${currentUser.uid}_${friendUid}` : `${friendUid}_${currentUser.uid}`;

                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between p-3 bg-wa-panel border border-wa-border/50 rounded-xl active:bg-wa-card cursor-pointer transition";
                    item.onclick = () => openChatScreen(chatId, friendName, friendUid);
                    item.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-wa-green text-white font-bold flex items-center justify-center text-sm relative">
                                ${friendName.charAt(0).toUpperCase()}
                                <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-wa-panel ${friendUser.status === 'online' ? 'bg-emerald-500' : 'bg-gray-500'}"></span>
                            </div>
                            <div>
                                <h4 class="font-semibold text-wa-text text-xs">${friendName}</h4>
                                <p class="text-[10px] text-wa-subtext">${friendUser.status || 'offline'}</p>
                            </div>
                        </div>
                        <button class="bg-wa-green/20 text-wa-green px-3 py-1.5 rounded-lg text-xs font-semibold"><i class="fa-solid fa-comment mr-1"></i> Chat</button>
                    `;
                    listEl.appendChild(item);
                });
            });
        }

        function renderRecentChatsList() {
            const listEl = document.getElementById('recent-chats-list');
            listEl.innerHTML = '';

            const friendUids = Object.keys(myFriendsCache);
            if (friendUids.length === 0) {
                listEl.innerHTML = `<p class="text-center text-wa-subtext text-xs py-8">No chat history found.</p>`;
                return;
            }

            friendUids.forEach(friendUid => {
                db.ref('users/' + friendUid).once('value').then(userSnap => {
                    const friendUser = userSnap.val() || {};
                    const friendName = friendUser.name || 'User';
                    const chatId = currentUser.uid < friendUid ? `${currentUser.uid}_${friendUid}` : `${friendUid}_${currentUser.uid}`;

                    db.ref('chats/' + chatId).once('value').then(chatSnap => {
                        const chatData = chatSnap.val() || {};
                        const lastMsg = chatData.lastMessage || 'Tap to chat';

                        const item = document.createElement('div');
                        item.className = "flex items-center gap-3 p-3 bg-wa-panel border border-wa-border/50 rounded-xl active:bg-wa-card cursor-pointer";
                        item.onclick = () => openChatScreen(chatId, friendName, friendUid);
                        item.innerHTML = `
                            <div class="w-10 h-10 rounded-full bg-wa-green text-white font-bold flex items-center justify-center text-sm flex-shrink-0">
                                ${friendName.charAt(0).toUpperCase()}
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="font-semibold text-wa-text text-xs truncate">${friendName}</h4>
                                <p class="text-[11px] text-wa-subtext truncate">${lastMsg}</p>
                            </div>
                        `;
                        listEl.appendChild(item);
                    });
                });
            });
        }

        function searchUsersInDB(query) {
            const resultsEl = document.getElementById('db-search-results');
            const q = query.trim().toLowerCase();
            if (!q) { resultsEl.innerHTML = `<p class="text-center text-wa-subtext text-xs py-6">Type name or email to search</p>`; return; }

            resultsEl.innerHTML = '';
            for (let uid in allUsersCache) {
                if (uid === currentUser.uid) continue;
                const u = allUsersCache[uid];
                if (!u) continue;

                const name = (u.name || '').toLowerCase();
                const email = (u.email || '').toLowerCase();

                if (name.includes(q) || email.includes(q)) {
                    const isAlreadyFriend = myFriendsCache && myFriendsCache[uid];
                    const displayName = u.name || (u.email ? u.email.split('@')[0] : 'User');

                    const div = document.createElement('div');
                    div.className = 'flex items-center justify-between p-2.5 bg-wa-panel rounded-xl border border-wa-border/40';
                    div.innerHTML = `
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-full bg-wa-green text-white font-bold flex items-center justify-center text-xs">
                                ${displayName.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h4 class="font-semibold text-wa-text text-xs">${displayName}</h4>
                                <p class="text-[10px] text-wa-subtext">${u.email || ''}</p>
                            </div>
                        </div>
                        <div>
                            ${isAlreadyFriend ? 
                                `<button onclick="openChatFromSearch('${uid}', '${displayName}')" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-semibold">Chat</button>` :
                                `<button onclick="addFriend('${uid}')" class="bg-wa-green text-white px-3 py-1 rounded-lg text-xs font-semibold">Add</button>`
                            }
                        </div>
                    `;
                    resultsEl.appendChild(div);
                }
            }
        }

        function addFriend(targetUid) {
            db.ref('friends/' + currentUser.uid + '/' + targetUid).set(true);
            db.ref('friends/' + targetUid + '/' + currentUser.uid).set(true);
            alert('Friend added successfully!');
            switchTab('friends');
        }

        function openChatFromSearch(targetUid, targetName) {
            const chatId = currentUser.uid < targetUid ? `${currentUser.uid}_${targetUid}` : `${targetUid}_${currentUser.uid}`;
            openChatScreen(chatId, targetName, targetUid);
        }

        function openChatScreen(chatId, otherName, otherUid) {
            activeChatId = chatId;
            targetFriendUid = otherUid;
            document.getElementById('active-chat-screen').classList.remove('hidden');
            document.getElementById('active-name').innerText = otherName;
            document.getElementById('active-avatar').innerText = otherName.charAt(0).toUpperCase();

            db.ref('users/' + otherUid + '/status').on('value', snap => {
                document.getElementById('active-status').innerText = snap.val() || 'offline';
            });

            const msgBox = document.getElementById('messages-box');
            db.ref('chats/' + chatId + '/messages').on('value', snap => {
                msgBox.innerHTML = '';
                if(snap.exists()) {
                    snap.forEach(mSnap => {
                        const msg = mSnap.val();
                        const isMe = msg.sender === currentUser.uid;
                        const time = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        
                        const div = document.createElement('div');
                        div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-1.5`;
                        div.innerHTML = `
                            <div class="max-w-[82%] rounded-2xl px-3 py-1.5 shadow text-xs ${isMe ? 'bg-wa-lightgreen' : 'bg-wa-incoming'}">
                                <p class="text-wa-text break-words">${msg.text}</p>
                                <div class="text-[9px] text-wa-subtext text-right mt-0.5">${time}</div>
                            </div>
                        `;
                        msgBox.appendChild(div);
                    });
                    msgBox.scrollTop = msgBox.scrollHeight;
                }
            });

            listenForCalls(chatId);
        }

        function closeChatScreen() {
            document.getElementById('active-chat-screen').classList.add('hidden');
            activeChatId = null;
            targetFriendUid = null;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(!text || !activeChatId) return;

            const msgData = { sender: currentUser.uid, text: text, timestamp: Date.now() };
            db.ref('chats/' + activeChatId + '/messages').push(msgData);
            db.ref('chats/' + activeChatId).update({ lastMessage: text, lastTime: Date.now() });

            input.value = '';
        }

        function handleAttachment(e) {
            const file = e.target.files[0];
            if(!file || !activeChatId) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const msgData = {
                    sender: currentUser.uid,
                    text: '📎 Sent a file: ' + file.name,
                    timestamp: Date.now()
                };
                db.ref('chats/' + activeChatId + '/messages').push(msgData);
                db.ref('chats/' + activeChatId).update({ lastMessage: msgData.text, lastTime: Date.now() });
            };
            reader.readAsDataURL(file);
        }

        // ================= FULLY FUNCTIONAL WEBRTC VIDEO/AUDIO CALL SYSTEM =================
        async function startCall(type) {
            if(!activeChatId) return;
            
            document.getElementById('call-modal').classList.remove('hidden');
            document.getElementById('call-user-name').innerText = document.getElementById('active-name').innerText;
            document.getElementById('call-status-badge').innerText = "Calling...";

            if(type === 'audio') {
                document.getElementById('local-video').classList.add('hidden');
                document.getElementById('remote-video').classList.add('hidden');
                document.getElementById('audio-call-indicator').classList.remove('hidden');
                document.getElementById('audio-call-indicator').classList.add('flex');
            } else {
                document.getElementById('local-video').classList.remove('hidden');
                document.getElementById('remote-video').classList.remove('hidden');
                document.getElementById('audio-call-indicator').classList.add('hidden');
            }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: type === 'video', 
                    audio: true 
                });
                
                if(type === 'video') {
                    document.getElementById('local-video').srcObject = localStream;
                }

                createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                rtcCallRef = db.ref('chats/' + activeChatId + '/call');
                
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                rtcCallRef.set({ type: 'offer', offer: { type: offer.type, sdp: offer.sdp }, caller: currentUser.uid });

                rtcCallRef.on('value', async snap => {
                    const data = snap.val();
                    if(!data) return;
                    if(data.type === 'answer' && !peerConnection.currentRemoteDescription && data.answer) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                        document.getElementById('call-status-badge').innerText = "Connected";
                        document.getElementById('call-status-badge').className = "text-xs text-emerald-400 font-semibold";
                    }
                    if(data.candidate && peerConnection) {
                        try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
                    }
                });

            } catch(err) {
                alert("Permission error: Camera/Microphone access is required for calls.");
                endCall();
            }
        }

        function listenForCalls(chatId) {
            const callRef = db.ref('chats/' + chatId + '/call');
            callRef.on('value', async snap => {
                const data = snap.val();
                if(!data || data.caller === currentUser.uid) return;

                if(data.type === 'offer' && !peerConnection) {
                    if(confirm("Incoming Call! Do you want to answer?")) {
                        document.getElementById('call-modal').classList.remove('hidden');
                        document.getElementById('call-user-name').innerText = "Incoming Call";
                        rtcCallRef = callRef;

                        try {
                            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                            document.getElementById('local-video').srcObject = localStream;

                            createPeerConnection();
                            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                            const answer = await peerConnection.createAnswer();
                            await peerConnection.setLocalDescription(answer);
                            
                            callRef.update({ type: 'answer', answer: { type: answer.type, sdp: answer.sdp } });
                            document.getElementById('call-status-badge').innerText = "Connected";
                            document.getElementById('call-status-badge').className = "text-xs text-emerald-400 font-semibold";

                        } catch(err) {
                            alert("Unable to access camera/microphone.");
                        }
                    }
                }
            });
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(iceServers);
            peerConnection.ontrack = event => {
                document.getElementById('remote-video').srcObject = event.streams[0];
            };
            peerConnection.onicecandidate = event => {
                if(event.candidate && rtcCallRef) {
                    rtcCallRef.child('candidate').set(event.candidate.toJSON());
                }
            };
        }

        function endCall() {
            if(localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if(peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if(activeChatId) {
                db.ref('chats/' + activeChatId + '/call').remove();
            }
            document.getElementById('call-modal').classList.add('hidden');
            document.getElementById('call-status-badge').innerText = "Ringing...";
            document.getElementById('call-status-badge').className = "text-xs text-yellow-400";
        }
    </script>
</body>
