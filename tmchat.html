<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TMChat - Mobile Friendly</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wa: {
                            dark: '#111b21',
                            panel: '#202c33',
                            hover: '#2a3942',
                            green: '#00a884',
                            lightgreen: '#005c4b',
                            incoming: '#202c33',
                            text: '#e9edef',
                            subtext: '#8696a0',
                            border: '#374248'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b141a; color: #e9edef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #374248; border-radius: 3px; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden">

    <!-- MAIN APP CONTAINER -->
    <div id="app-container" class="w-full h-full flex relative overflow-hidden">
        
        <!-- AUTH SCREEN -->
        <div id="auth-screen" class="absolute inset-0 z-50 bg-wa-dark flex items-center justify-center p-4">
            <div class="bg-wa-panel p-6 rounded-xl shadow-2xl w-full max-w-sm border border-wa-border">
                <div class="text-center mb-5">
                    <div class="inline-flex items-center justify-center w-14 h-14 bg-wa-green text-white rounded-full text-2xl font-bold mb-2 shadow">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <h1 class="text-xl font-bold text-wa-text">TMChat</h1>
                    <p id="auth-subtitle" class="text-wa-subtext text-xs mt-1">Sign in to start messaging</p>
                </div>

                <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3">
                    <div id="name-field" class="hidden">
                        <label class="block text-[10px] uppercase text-wa-subtext font-semibold mb-1">Full Name</label>
                        <input type="text" id="auth-name" placeholder="John Doe" class="w-full bg-wa-dark text-wa-text px-3 py-2.5 rounded-lg border border-wa-border focus:outline-none focus:border-wa-green text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-wa-subtext font-semibold mb-1">Email</label>
                        <input type="email" id="auth-email" required placeholder="user@example.com" class="w-full bg-wa-dark text-wa-text px-3 py-2.5 rounded-lg border border-wa-border focus:outline-none focus:border-wa-green text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-wa-subtext font-semibold mb-1">Password</label>
                        <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-wa-dark text-wa-text px-3 py-2.5 rounded-lg border border-wa-border focus:outline-none focus:border-wa-green text-sm">
                    </div>
                    <button type="submit" id="auth-btn" class="w-full bg-wa-green hover:bg-emerald-600 text-white font-semibold py-2.5 rounded-lg transition text-sm">Sign In</button>
                </form>

                <div class="text-center mt-4">
                    <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-wa-green text-xs hover:underline">Don't have an account? Register</button>
                </div>
            </div>
        </div>

        <!-- CHAT DASHBOARD -->
        <div id="chat-dashboard" class="hidden w-full h-full flex relative">
            
            <!-- SIDEBAR PANEL (FRIEND/CHAT LIST) -->
            <div id="sidebar-panel" class="w-full md:w-[380px] h-full bg-wa-panel border-r border-wa-border flex flex-col flex-shrink-0 z-10">
                
                <!-- Header -->
                <div class="h-14 bg-wa-panel px-4 flex items-center justify-between border-b border-wa-border">
                    <div class="flex items-center gap-2">
                        <div id="current-user-avatar" class="w-8 h-8 rounded-full bg-wa-green text-white font-bold flex items-center justify-center text-sm shadow">U</div>
                        <span id="current-user-name" class="font-semibold text-wa-text text-sm truncate max-w-[120px]">Profile</span>
                    </div>
                    <div class="flex items-center gap-4 text-wa-subtext text-base">
                        <button onclick="openSearchModal()" title="Add Friend" class="hover:text-wa-text p-1"><i class="fa-solid fa-user-plus"></i></button>
                        <button onclick="logout()" title="Logout" class="hover:text-red-400 p-1"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                </div>

                <!-- Search -->
                <div class="p-2 bg-wa-dark border-b border-wa-border">
                    <input type="text" id="sidebar-search" oninput="filterChatList(this.value)" placeholder="Search friends..." class="w-full bg-wa-panel text-wa-text px-3 py-1.5 rounded-lg text-xs border border-wa-border focus:outline-none">
                </div>

                <!-- List View -->
                <div id="chat-list" class="flex-1 overflow-y-auto divide-y divide-wa-border/40">
                    <!-- Added Friends Show Here -->
                </div>
            </div>

            <!-- MAIN CHAT AREA (Mobile friendly view toggle) -->
            <div id="chat-main-area" class="w-full md:flex-1 h-full bg-wa-dark flex flex-col absolute md:relative inset-0 bg-wa-dark hidden md:flex z-20">
                
                <div id="empty-chat-state" class="hidden md:flex flex-1 flex-col items-center justify-center p-6 text-center">
                    <div class="text-wa-subtext text-5xl mb-3"><i class="fa-brands fa-whatsapp"></i></div>
                    <h2 class="text-xl font-light text-wa-text mb-1">TMChat Web</h2>
                    <p class="text-wa-subtext text-xs">Select a friend to start messaging.</p>
                </div>

                <!-- Active Chat Container -->
                <div id="active-chat-container" class="hidden flex-1 flex flex-col h-full w-full">
                    <!-- Chat Header -->
                    <div class="h-14 bg-wa-panel px-3 flex items-center justify-between border-b border-wa-border">
                        <div class="flex items-center gap-2">
                            <!-- Mobile Back Button -->
                            <button onclick="backToChatList()" class="text-wa-subtext text-lg pr-2 hover:text-wa-text"><i class="fa-solid fa-arrow-left"></i></button>
                            <div id="active-avatar" class="w-8 h-8 rounded-full bg-wa-green text-white font-bold flex items-center justify-center text-sm">?</div>
                            <div>
                                <h3 id="active-name" class="font-semibold text-wa-text text-sm leading-tight">Name</h3>
                                <p id="active-status" class="text-[10px] text-wa-subtext">offline</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 text-wa-subtext text-base">
                            <button onclick="startCall('audio')" class="hover:text-wa-text"><i class="fa-solid fa-phone"></i></button>
                            <button onclick="startCall('video')" class="hover:text-wa-text"><i class="fa-solid fa-video"></i></button>
                        </div>
                    </div>

                    <!-- Messages Box -->
                    <div id="messages-box" class="flex-1 overflow-y-auto p-3 space-y-2 bg-[#0b141a]">
                        <!-- Messages -->
                    </div>

                    <!-- Input Area -->
                    <div class="bg-wa-panel px-3 py-2 flex items-center gap-2 border-t border-wa-border">
                        <input type="file" id="attachment-input" class="hidden" onchange="handleAttachment(event)">
                        <button onclick="document.getElementById('attachment-input').click()" class="text-wa-subtext text-lg"><i class="fa-solid fa-paperclip"></i></button>
                        <input type="text" id="message-input" onkeydown="if(event.key==='Enter') sendMessage()" placeholder="Message" class="flex-1 bg-wa-dark text-wa-text px-3 py-2 rounded-lg text-xs border border-wa-border focus:outline-none">
                        <button onclick="sendMessage()" class="bg-wa-green text-white w-8 h-8 rounded-full flex items-center justify-center text-xs"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SEARCH MODAL -->
        <div id="search-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
            <div class="bg-wa-panel w-full max-w-md rounded-xl shadow-2xl border border-wa-border flex flex-col max-h-[85vh]">
                <div class="p-3 border-b border-wa-border flex items-center justify-between">
                    <h3 class="font-bold text-wa-text text-sm"><i class="fa-solid fa-user-plus mr-1 text-wa-green"></i>Add Friends</h3>
                    <button onclick="closeSearchModal()" class="text-wa-subtext text-lg"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="p-2 border-b border-wa-border bg-wa-dark">
                    <input type="text" id="db-user-search" oninput="searchUsersInDB(this.value)" placeholder="Search name or email..." class="w-full bg-wa-panel text-wa-text px-3 py-2 rounded-lg text-xs border border-wa-border focus:outline-none">
                </div>
                <div id="db-search-results" class="flex-1 overflow-y-auto p-3 space-y-2">
                    <p class="text-center text-wa-subtext text-xs py-4">Type a name to search...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvK59-OiliO6lC8NkRbO7uK5ESEEMg_e4",
            authDomain: "tma2z-4d472.firebaseapp.com",
            databaseURL: "https://tma2z-4d472-default-rtdb.firebaseio.com",
            projectId: "tma2z-4d472",
            storageBucket: "tma2z-4d472.firebasestorage.app",
            messagingSenderId: "637327747107",
            appId: "1:637327747107:web:39686aaa75a525cb22e996"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let isRegistering = false;
        let activeChatId = null;
        let allUsersCache = {};
        let myFriendsCache = {};

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('chat-dashboard').classList.remove('hidden');
                
                const userRef = db.ref('users/' + user.uid);
                userRef.once('value').then(snap => {
                    const defaultName = user.email ? user.email.split('@')[0] : 'User';
                    if (!snap.exists()) {
                        userRef.set({ uid: user.uid, name: defaultName, email: user.email || '', status: 'online' });
                    }
                    const val = snap.val() || {};
                    const name = val.name || defaultName;
                    document.getElementById('current-user-name').innerText = name;
                    document.getElementById('current-user-avatar').innerText = name.charAt(0).toUpperCase();
                });

                initDashboard();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('chat-dashboard').classList.add('hidden');
            }
        });

        function toggleAuthMode() {
            isRegistering = !isRegistering;
            document.getElementById('name-field').classList.toggle('hidden', !isRegistering);
            document.getElementById('auth-btn').innerText = isRegistering ? "Register" : "Sign In";
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const name = document.getElementById('auth-name').value;

            if (isRegistering) {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(cred => db.ref('users/' + cred.user.uid).set({ uid: cred.user.uid, name: name || email.split('@')[0], email: email, status: 'online' }))
                    .catch(err => alert(err.message));
            } else {
                auth.signInWithEmailAndPassword(email, password).catch(err => alert(err.message));
            }
        }

        function logout() {
            if(currentUser) db.ref('users/' + currentUser.uid + '/status').set('offline');
            auth.signOut();
        }

        function initDashboard() {
            db.ref('users/' + currentUser.uid + '/status').set('online');
            db.ref('users/' + currentUser.uid + '/status').onDisconnect().set('offline');

            db.ref('users').on('value', snap => { if(snap.exists()) allUsersCache = snap.val(); });
            db.ref('friends/' + currentUser.uid).on('value', snap => {
                myFriendsCache = snap.val() || {};
                renderChatList();
            });
        }

        function renderChatList() {
            const chatListEl = document.getElementById('chat-list');
            chatListEl.innerHTML = '';
            
            const friendUids = Object.keys(myFriendsCache);
            if (friendUids.length === 0) {
                chatListEl.innerHTML = `<p class="text-center text-wa-subtext text-xs p-5">No friends added yet. Click <i class="fa-solid fa-user-plus"></i> above to add!</p>`;
                return;
            }

            friendUids.forEach(friendUid => {
                db.ref('users/' + friendUid).once('value').then(userSnap => {
                    const friendUser = userSnap.val() || {};
                    const friendName = friendUser.name || (friendUser.email ? friendUser.email.split('@')[0] : 'User');
                    const chatId = currentUser.uid < friendUid ? `${currentUser.uid}_${friendUid}` : `${friendUid}_${currentUser.uid}`;

                    db.ref('chats/' + chatId).once('value').then(chatSnap => {
                        const chatData = chatSnap.val() || {};
                        const lastMsg = chatData.lastMessage || 'Tap to chat';

                        const itemDiv = document.createElement('div');
                        itemDiv.className = `flex items-center gap-3 px-3 py-3 hover:bg-wa-hover cursor-pointer transition border-b border-wa-border/30`;
                        itemDiv.onclick = () => openChat(chatId, friendName, friendUid);
                        itemDiv.innerHTML = `
                            <div class="w-10 h-10 rounded-full bg-wa-green text-white font-bold flex items-center justify-center text-sm relative flex-shrink-0">
                                ${friendName.charAt(0).toUpperCase()}
                                <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-wa-panel ${friendUser.status === 'online' ? 'bg-emerald-500' : 'bg-gray-500'}"></span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h4 class="font-semibold text-wa-text text-xs truncate">${friendName}</h4>
                                <p class="text-[11px] text-wa-subtext truncate">${lastMsg}</p>
                            </div>
                        `;
                        chatListEl.appendChild(itemDiv);
                    });
                });
            });
        }

        function openSearchModal() {
            document.getElementById('search-modal').classList.remove('hidden');
            document.getElementById('db-user-search').focus();
        }
        function closeSearchModal() {
            document.getElementById('search-modal').classList.add('hidden');
        }

        function searchUsersInDB(query) {
            const resultsEl = document.getElementById('db-search-results');
            const q = query.trim().toLowerCase();
            if (!q) { resultsEl.innerHTML = `<p class="text-center text-wa-subtext text-xs py-4">Type a name to search...</p>`; return; }

            resultsEl.innerHTML = '';
            for (let uid in allUsersCache) {
                if (uid === currentUser.uid) continue;
                const u = allUsersCache[uid];
                if (!u) continue;

                const name = (u.name || '').toLowerCase();
                const email = (u.email || '').toLowerCase();

                if (name.includes(q) || email.includes(q)) {
                    const isAlreadyFriend = myFriendsCache && myFriendsCache[uid];
                    const displayName = u.name || (u.email ? u.email.split('@')[0] : 'User');

                    const div = document.createElement('div');
                    div.className = 'flex items-center justify-between p-2 hover:bg-wa-dark rounded-lg';
                    div.innerHTML = `
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-wa-green text-white font-bold flex items-center justify-center text-xs">
                                ${displayName.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h4 class="font-semibold text-wa-text text-xs">${displayName}</h4>
                                <p class="text-[10px] text-wa-subtext">${u.email || ''}</p>
                            </div>
                        </div>
                        <div>
                            ${isAlreadyFriend ? 
                                `<button onclick="startChatFromSearch('${uid}', '${displayName}')" class="bg-blue-600 text-white px-2.5 py-1 rounded text-[11px]">Chat</button>` :
                                `<button onclick="addFriend('${uid}')" class="bg-wa-green text-white px-3 py-1 rounded text-[11px]">Add</button>`
                            }
                        </div>
                    `;
                    resultsEl.appendChild(div);
                }
            }
        }

        function addFriend(targetUid) {
            db.ref('friends/' + currentUser.uid + '/' + targetUid).set(true);
            db.ref('friends/' + targetUid + '/' + currentUser.uid).set(true);
            closeSearchModal();
        }

        function startChatFromSearch(targetUid, targetName) {
            closeSearchModal();
            const chatId = currentUser.uid < targetUid ? `${currentUser.uid}_${targetUid}` : `${targetUid}_${currentUser.uid}`;
            openChat(chatId, targetName, targetUid);
        }

        // OPEN CHAT (MOBILE FRIENDLY SWITCH)
        function openChat(chatId, otherName, otherUid) {
            activeChatId = chatId;
            
            // Mobile UI Switch: Hide sidebar, show main chat
            document.getElementById('sidebar-panel').classList.add('hidden');
            document.getElementById('sidebar-panel').classList.remove('w-full');
            document.getElementById('chat-main-area').classList.remove('hidden');
            document.getElementById('active-chat-container').classList.remove('hidden');
            document.getElementById('empty-chat-state').classList.add('hidden');

            document.getElementById('active-name').innerText = otherName;
            document.getElementById('active-avatar').innerText = otherName.charAt(0).toUpperCase();

            db.ref('users/' + otherUid + '/status').on('value', snap => {
                document.getElementById('active-status').innerText = snap.val() || 'offline';
            });

            const msgBox = document.getElementById('messages-box');
            db.ref('chats/' + chatId + '/messages').on('value', snap => {
                msgBox.innerHTML = '';
                if(snap.exists()) {
                    snap.forEach(mSnap => {
                        const msg = mSnap.val();
                        const isMe = msg.sender === currentUser.uid;
                        const time = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        
                        const div = document.createElement('div');
                        div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-1.5`;
                        div.innerHTML = `
                            <div class="max-w-[80%] rounded-lg px-2.5 py-1.5 shadow text-xs ${isMe ? 'bg-wa-lightgreen' : 'bg-wa-incoming'}">
                                <p class="text-wa-text break-words">${msg.text}</p>
                                <div class="text-[9px] text-wa-subtext text-right mt-0.5">${time}</div>
                            </div>
                        `;
                        msgBox.appendChild(div);
                    });
                    msgBox.scrollTop = msgBox.scrollHeight;
                }
            });
        }

        // BACK TO CHAT LIST (FOR MOBILE)
        function backToChatList() {
            document.getElementById('sidebar-panel').classList.remove('hidden');
            document.getElementById('sidebar-panel').classList.add('w-full');
            document.getElementById('chat-main-area').classList.add('hidden');
            activeChatId = null;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(!text || !activeChatId) return;

            const msgData = { sender: currentUser.uid, text: text, timestamp: Date.now() };
            db.ref('chats/' + activeChatId + '/messages').push(msgData);
            db.ref('chats/' + activeChatId).update({ lastMessage: text, lastTime: Date.now() });

            input.value = '';
        }
    </script>
</body>
</html>
